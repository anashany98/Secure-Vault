services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevault -d securevault"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - securevault-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.backend
    env_file:
      - ./deploy/securevault.secrets.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_PATH: /app/runtime/backups
      CLIENT_CRYPTO_MANIFEST_PATH: /app/runtime/crypto-key-manifest.json
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgresql://securevault:${POSTGRES_PASSWORD}@postgres:5432/securevault
      DB_CLIENT: postgres
      LOGIN_LOCKOUT_ATTEMPTS: ${LOGIN_LOCKOUT_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      MANDATORY_2FA_EMAILS: ${MANDATORY_2FA_EMAILS:-}
      MANDATORY_2FA_ROLES: ${MANDATORY_2FA_ROLES:-admin}
      PORT: 3000
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    volumes:
      - securevault-backend:/app/runtime

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  securevault-backend:
  securevault-postgres:
